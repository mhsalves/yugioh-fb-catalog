# Dependabot version updates.
# Security updates for vulnerable dependencies are separate and are turned on
# in Settings → Code security → Dependabot security updates.
version: 2
updates:
  # Yarn workspace: one root lockfile covers the root tooling, catalog/ (npm library)
  # and mkt_site/ (static website, Next.js).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # React, Next and MUI move together; keep their bumps in one PR.
      framework:
        patterns: ["next", "react", "react-dom", "@types/react", "@mui/*", "@emotion/*", "@toolpad/*"]
        update-types: ["minor", "patch"]
      # Lint, format and test tooling.
      tooling:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-*", "globals", "prettier", "vitest", "vite"]
        update-types: ["minor", "patch"]
      # One PR per week for every other non-major bump.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the Node runtime major; bump it on purpose.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keeps the GitHub Actions workflows up to date (bumps the pinned SHA and the version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
