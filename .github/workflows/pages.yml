# Deploys the site to GitHub Pages after a merge to main that changes what the site shows (spec 07 P-1).
# The site is built from the workspace catalog (P-2), so catalog data and code changes redeploy it too.
# Every action is pinned by full commit SHA; Dependabot bumps the SHA and the version comment.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mkt_site/**"
      - "!mkt_site/**/*.md"
      - "catalog/data/**"
      - "catalog/src/**"
      - "catalog/schema/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch: # manual redeploy

permissions:
  contents: read

# A newer merge replaces a deploy still in progress, so the site always ends on the latest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Validate data
        run: yarn validate

      - name: Test
        run: yarn test

      - name: Build catalog and site
        run: yarn build
        env:
          # "/yugioh-fb-catalog" for this repo; follows forks and custom domains (spec 07 P-3).
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute URL for the per-card pages' canonical links and sitemap.xml (spec 09 C-7).
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: mkt_site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
